<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
}
#container {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
#pet {
  width: 160%;
  height: 160%;
  position: absolute;
  left: -30%;
  top: -65%;
  opacity: 1;
  transition: opacity 0.15s ease-out;
}
#pet.fading { opacity: 0; }
</style>
</head>
<body>
<div id="container">
  <object id="pet" type="image/svg+xml" data="svg/clawd-idle-follow.svg"></object>
</div>
<script>
var pet = document.getElementById('pet');
var fadeTimeout = null;

function setSvg(file) {
  if (fadeTimeout) { clearTimeout(fadeTimeout); fadeTimeout = null; }
  pet.classList.add('fading');
  fadeTimeout = setTimeout(function() {
    pet.data = 'svg/' + file;
    pet.onload = function() {
      pet.classList.remove('fading');
      pet.onload = null;
    };
    setTimeout(function() { pet.classList.remove('fading'); }, 500);
  }, 150);
}

function setSvgImmediate(file) {
  if (fadeTimeout) { clearTimeout(fadeTimeout); fadeTimeout = null; }
  pet.classList.remove('fading');
  pet.data = 'svg/' + file;
}

function currentSvg() {
  var data = pet.data || '';
  var idx = data.lastIndexOf('/');
  return idx >= 0 ? data.substring(idx + 1) : data;
}
</script>
</body>
</html>
